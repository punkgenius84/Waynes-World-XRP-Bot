# path: .github/workflows/xrp-empire-surge.yml
name: XRP Empire — Surge Checks (~12m)

on:
  schedule:
    - cron: '6,18,30,42,54 * * * *'   # off :00 to reduce contention
  workflow_dispatch:

# contents: write is required so the cooldown (surge_state.json) is saved.
# Without it every 12-minute run re-fires the same alert.
permissions:
  contents: write

concurrency:
  group: xrp-empire-bot-surge
  cancel-in-progress: false

jobs:
  run-surge:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # The script imports discord_webhook/tweepy/matplotlib/numpy at module load, so the
      # surge lane needs the full requirements too (the old "minimal deps" crashed on import).
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run XRP Empire Bot (surge check only)
        env:
          RUN_MODE:             surge   # → no reports, no tweets, no news
          DISCORD_WEBHOOK_XRP:  ${{ secrets.DISCORD_WEBHOOK_XRP }}
          DISCORD_WEBHOOK_BTC:  ${{ secrets.DISCORD_WEBHOOK_BTC }}
          DISCORD_WEBHOOK_ETH:  ${{ secrets.DISCORD_WEBHOOK_ETH }}
          DISCORD_WEBHOOK_ADA:  ${{ secrets.DISCORD_WEBHOOK_ADA }}
          DISCORD_WEBHOOK_SOL:  ${{ secrets.DISCORD_WEBHOOK_SOL }}
          DISCORD_WEBHOOK_HBAR: ${{ secrets.DISCORD_WEBHOOK_HBAR }}
          DISCORD_WEBHOOK_ZEC:  ${{ secrets.DISCORD_WEBHOOK_ZEC }}
          CRYPTOCOMPARE_API_KEY: ${{ secrets.CRYPTOCOMPARE_API_KEY }}
        run: python combined_xrp_intel_report.py

      - name: Commit surge state (only if an alert fired)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add surge_state.json
          if git diff --cached --quiet; then
            echo "No surge state change"; exit 0
          fi
          git commit -m "Auto: surge state [skip ci]"
          for i in 1 2 3 4 5; do
            if git pull --rebase -X theirs origin main && git push origin HEAD:main; then
              echo "pushed on attempt $i"; exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 4))
          done
          echo "::error::Could not push surge state"
          exit 1
