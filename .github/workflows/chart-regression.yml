name: Chart Rendering Regression

on:
  pull_request:
    paths:
      - "combined_xrp_intel_report.py"
      - "requirements.txt"
      - "tests/**"
      - ".github/workflows/chart-regression.yml"
  push:
    branches:
      - "fix/chart-rendering-dependency-diagnostics"
    paths:
      - "combined_xrp_intel_report.py"
      - "requirements.txt"
      - "tests/**"
      - ".github/workflows/chart-regression.yml"

permissions:
  contents: read

jobs:
  chart-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify chart imports and versions
        run: |
          python - <<'PY'
          import dateutil
          import matplotlib
          import mplfinance
          import numpy
          import pandas
          import PIL
          import six
          print("python-dateutil:", dateutil.__version__)
          print("matplotlib:", matplotlib.__version__)
          print("mplfinance:", mplfinance.__version__)
          print("numpy:", numpy.__version__)
          print("pandas:", pandas.__version__)
          print("Pillow:", PIL.__version__)
          print("six:", six.__version__)
          PY

      - name: Render chart regression test
        run: python -m unittest discover -s tests -p "test_chart_rendering.py" -v
