name: Key-Level Regression Tests

on:
  pull_request:
    branches: [main]
    paths:
      - "combined_xrp_intel_report.py"
      - "tests/**"
      - ".github/workflows/key-level-tests.yml"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-key-levels:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python files
        run: python -m compileall -q combined_xrp_intel_report.py strategies tests

      - name: Run regression tests
        run: python -m unittest discover -s tests -v
